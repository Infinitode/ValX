name: Publish to PyPI

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and test release distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Check that the release tag matches the package version
        run: |
          python - <<'PY'
          import os
          import tomllib

          with open('pyproject.toml', 'rb') as config:
              version = tomllib.load(config)['project']['version']
          tag = os.environ['GITHUB_REF_NAME']
          if tag.removeprefix('v') != version:
              raise SystemExit(f'Release tag {tag!r} does not match package version {version!r}.')
          PY
      - name: Build wheel and source distribution
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Test the installed wheel
        run: |
          python -m pip install dist/*.whl
          python -I test.py
      - name: Upload checked distributions
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish with Trusted Publishing and attestations
    if: github.repository == 'Infinitode/ValX'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Request the short-lived PyPI credential and sign the attestations.
    # The PyPI Trusted Publisher is registered with its Environment field blank.
    steps:
      - name: Download the checked distributions from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: dist/
          digest-mismatch: error
      - name: Upload wheel and sdist with PEP 740 publish attestations
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          attestations: true
